services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deputados_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deputados_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --queue=expenses,default --sleep=3 --tries=3 --timeout=120
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: deputados_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: deputados
      MYSQL_USER: deputados
      MYSQL_PASSWORD: deputados
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
